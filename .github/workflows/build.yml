name: Build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      platform:
        description: Build one platform for diagnosis, or all platforms for release
        type: choice
        default: all
        options: [all, windows-x64, windows-arm64, linux-x64, linux-arm64, linux-loong64, linux-mips64el]
      audit_only:
        description: Audit the selected cross sysroot without compiling the engine
        type: boolean
        default: false

permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}-${{ inputs.platform || 'all' }}
  cancel-in-progress: true
env:
  RUST_VERSION: '1.99.0'
  LLVM_VERSION: '15.0.6'
  VCPKG_COMMIT_ID: '9e593bb18ea69cc5095e012465dcd675a822ed0d'
  VCPKG_CMAKE_VERSION: '4.4.0'
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
jobs:
  targets:
    runs-on: ubuntu-24.04-arm
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: select
        env:
          PLATFORM: ${{ inputs.platform || 'all' }}
        run: python ci/build_matrix.py >> "$GITHUB_OUTPUT"

  browser:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend --ignore-scripts

      - name: Build browser assets once for all native targets
        run: node ci/browser.mjs desk
      - uses: actions/upload-artifact@v4
        with:
          name: browser
          path: browser/
          if-no-files-found: error
  native:
    permissions:
      contents: write
    needs: [browser, targets]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: browser
          path: browser/

      - uses: actions/cache/restore@v4
        if: runner.os == 'Linux'
        id: linux-tools
        with:
          path: .ci-cache/tools/
          key: ubuntu18-desk-tools-${{ matrix.platform }}-rust199-python3135-openssl354-cmake440-vcpkg9e593-glibc-nasm301-cross-v8-${{ hashFiles('ci/cross-*.sh', 'ci/audit_engine_sysroot.py', 'ci/cross-sysroot-roots.py') }}
          restore-keys: |
            ubuntu18-desk-tools-${{ matrix.platform }}-rust199-python3135-openssl354-cmake440-vcpkg9e593-glibc-nasm301-cross-v8-
            ubuntu18-desk-tools-${{ matrix.platform }}-rust199-python3135-openssl354-cmake440-vcpkg9e593-glibc-nasm301-cross-v7
            ubuntu18-desk-tools-${{ matrix.platform }}-rust199-python3135-openssl354-cmake440-vcpkg9e593-glibc-v3
            ubuntu18-desk-tools-${{ matrix.platform }}-rust199-python3135-openssl354-cmake440-vcpkg9e593-dl-v2
      - uses: actions/cache/restore@v4
        id: native-cache
        with:
          path: |
            .ci-cache/vcpkg/
            target/
            desk-engine/target/
          key: native-desk-${{ matrix.platform }}-rust199-ubuntu18-v2-${{ hashFiles('**/Cargo.lock', 'engine-patches/**', 'scripts/*.py', 'ci/linux-build.sh', 'ci/*.py', 'ci/cross-*.sh', 'ci/triplets/**') }}-${{ github.run_id }}
          restore-keys: native-desk-${{ matrix.platform }}-rust199-ubuntu18-v2-
      - uses: actions/setup-python@v5
        if: runner.os == 'Windows'
        with:
          python-version: '3.13'
          architecture: x64
      - uses: dtolnay/rust-toolchain@stable
        if: runner.os == 'Windows'
        with:
          # x64 build scripts can load the exact LLVM 15 used by RustDesk, also on the ARM runner.
          toolchain: '1.99.0-x86_64-pc-windows-msvc'
          targets: ${{ matrix.target }}
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: ${{ matrix.msvc }}
      # Copied from E:/NetJobs/rustdesk/.github/workflows/flutter-build.yml:
      # LLVM 15.0.6, vcpkg 9e593..., static target triplets and MSVC preparation.
      - name: Install LLVM and Clang
        if: runner.os == 'Windows'
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0
        with:
          version: ${{ env.LLVM_VERSION }}
          arch: x64
          directory: ${{ github.workspace }}/artifacts/llvm-x64
      - name: Prepare pinned RustDesk and hwcodec source with YooDesk adapters
        if: runner.os == 'Windows'
        run: python scripts/prepare_sources.py
      - name: Install CMake required by the RustDesk vcpkg scripts
        if: runner.os == 'Windows'
        run: python -m pip install 'cmake==4.4.0'
      - name: Setup vcpkg with GitHub Actions binary cache
        if: runner.os == 'Windows'
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2
        with:
          vcpkgDirectory: C:/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false
      - name: Install vcpkg dependencies from RustDesk's patched manifest
        if: runner.os == 'Windows'
        working-directory: artifacts/rustdesk-engine-src
        shell: pwsh
        run: |
          $binaryCache="$env:GITHUB_WORKSPACE/.ci-cache/vcpkg"
          New-Item -ItemType Directory -Force -Path $binaryCache | Out-Null
          $env:VCPKG_BINARY_SOURCES="clear;x-gha,readwrite;files,$binaryCache,readwrite"
          & "$env:VCPKG_ROOT/vcpkg.exe" install --triplet '${{ matrix.triplet }}' --host-triplet '${{ matrix.triplet }}' --x-install-root="$env:VCPKG_ROOT/installed"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Windows native code and run tests
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CARGO_BUILD_TARGET: ${{ matrix.target }}
          RUSTFLAGS: '-C target-feature=+crt-static'
          _CL_: '/MT'
          LIBCLANG_PATH: ${{ github.workspace }}/artifacts/llvm-x64/bin
        run: |
          $env:VCPKG_INSTALLED_ROOT="$env:VCPKG_ROOT/installed"
          $env:VCPKG_DEFAULT_TRIPLET='${{ matrix.triplet }}'
          $env:VCPKG_DEFAULT_HOST_TRIPLET='${{ matrix.triplet }}'
          if ($env:CARGO_BUILD_TARGET -eq 'aarch64-pc-windows-msvc') {
            $env:SODIUM_LIB_DIR="$env:VCPKG_ROOT/installed/${{ matrix.triplet }}/lib"
          }
          python scripts/build_engine.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:YOODESK_DESK_ENGINE_LIB_DIR="$env:GITHUB_WORKSPACE/desk-engine/target/$env:CARGO_BUILD_TARGET/release"
          cargo build --locked --release --lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:CARGO_BUILD_TARGET -eq 'aarch64-pc-windows-msvc') {
            # Use an explicit target and a fresh dependency directory for ARM64 tests.
            cargo test --locked --lib --target "$env:CARGO_BUILD_TARGET" --target-dir "$env:GITHUB_WORKSPACE/artifacts/arm64-tests" --verbose
          } else {
            cargo test --locked --lib
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ci/package.py desk --platform '${{ matrix.platform }}'
      - name: Build every Linux native dependency and binary on Ubuntu 18.04
        if: runner.os == 'Linux' && !matrix.cross
        shell: bash
        run: |
          # Same disposable runner cleanup as the RustDesk Linux workflow.
          sudo rm -rf /opt/ghc /usr/local/lib/android /usr/share/dotnet
          mkdir -p .ci-cache/tools .ci-cache/vcpkg
          docker run --rm \
            -e GITHUB_SHA -e RELEASE_VERSION \
            -v "$PWD:/workspace" -v "$PWD/.ci-cache/tools:/opt/yoodesk-tools" \
            ubuntu:18.04 bash /workspace/ci/linux-build.sh desk '${{ matrix.platform }}' '${{ matrix.target }}' '${{ matrix.triplet }}'
      - name: Cross-compile loong64/mips64el desk plugin with the RustDesk engine and verify under QEMU
        if: matrix.cross
        timeout-minutes: 360
        shell: bash
        env:
          YOODESK_SYSROOT_AUDIT_ONLY: ${{ inputs.audit_only && '1' || '0' }}
        run: |
          # Same disposable runner cleanup as the RustDesk Linux workflow.
          sudo rm -rf /opt/ghc /usr/local/lib/android /usr/share/dotnet
          mkdir -p .ci-cache/tools
          docker run --rm \
            -e GITHUB_SHA -e RELEASE_VERSION -e YOODESK_SYSROOT_AUDIT_ONLY -e RUST_VERSION='${{ env.RUST_VERSION }}' \
            -v "$PWD:/workspace" -v "$PWD/.ci-cache/tools:/opt/yoodesk-tools" \
            ubuntu:18.04 bash /workspace/ci/cross-engine-build.sh '${{ matrix.platform }}' '${{ matrix.target }}'
      - name: Upload the complete cross sysroot audit report
        if: always() && matrix.cross && inputs.audit_only
        uses: actions/upload-artifact@v4
        with:
          name: sysroot-audit-${{ matrix.platform }}
          path: artifacts/sysroot-audit-${{ matrix.platform }}.json
          if-no-files-found: warn
      - name: Publish immutable third-party native library SDK
        if: always() && matrix.cross && hashFiles('artifacts/native-sdk/*.tar.xz') != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: native-sdk-v1-${{ matrix.platform }}
          name: Native library SDK v1 ${{ matrix.platform }}
          target_commitish: ${{ github.sha }}
          make_latest: false
          overwrite_files: false
          fail_on_unmatched_files: true
          files: artifacts/native-sdk/*
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          path: dist/
          if-no-files-found: error
      - name: Return container build cache ownership to the runner
        if: always() && runner.os == 'Linux'
        shell: bash
        run: |
          for cache in .ci-cache/tools .ci-cache/vcpkg target desk-engine/target; do
            if [[ -e "$cache" ]]; then
              sudo chown -R "$(id -u):$(id -g)" "$cache"
            fi
          done
      - name: Detect reusable native build data
        if: always()
        id: native-data
        shell: bash
        run: |
          if [[ -d target || -d desk-engine/target ]] || [[ -n "$(ls -A .ci-cache/vcpkg 2>/dev/null)" ]]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Preserve native compilation and binary caches after a failed build
        if: always() && steps.native-data.outputs.present == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .ci-cache/vcpkg/
            target/
            desk-engine/target/
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Preserve successfully installed build tools even if native compilation fails
        if: always() && runner.os == 'Linux' && steps.linux-tools.outputs.cache-hit != 'true' && hashFiles('.ci-cache/tools/.ready') != ''
        uses: actions/cache/save@v4
        with:
          path: .ci-cache/tools/
          key: ${{ steps.linux-tools.outputs.cache-primary-key }}
  release:
    if: github.event_name != 'pull_request' && !inputs.audit_only && (github.event_name != 'workflow_dispatch' || inputs.platform == 'all')
    needs: native
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: dist/
          merge-multiple: true
      - name: Require all four platform archives before publishing
        run: |
          for platform in windows-x64 windows-arm64 linux-x64 linux-arm64 linux-loong64 linux-mips64el; do
            test -s "dist/yoodesk-desk-$platform.zip"
            (cd dist && sha256sum -c "yoodesk-desk-$platform.zip.sha256")
          done
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v0.1.0-ci.{0}', github.run_number) }}
          name: 'desk ${{ github.sha }}'
          target_commitish: ${{ github.sha }}
          make_latest: true
          fail_on_unmatched_files: true
          files: dist/*
