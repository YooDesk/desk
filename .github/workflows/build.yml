name: Build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      platform:
        description: Build one platform for diagnosis, or all platforms for release
        type: choice
        default: all
        options: [all, windows-x86, windows-x64, windows-arm64, linux-x64, linux-arm64, linux-loong64, linux-loong64-oldworld, linux-mips64el, macos-arm64, macos-x64]
      audit_only:
        description: Audit the selected cross sysroot without compiling the engine
        type: boolean
        default: false
      build_only:
        description: Compile and validate without publishing a release
        type: boolean
        default: false
      source_ref:
        description: Exact source commit when reusing completed platforms after a build-only fix
        type: string
        default: ''
      release_id:
        description: Prepared draft release ID for a historical source_ref
        type: string
        default: ''
      reuse_run_id:
        description: Completed run at source_ref whose successful native artifacts can be reused
        type: string
        default: ''

permissions:
  contents: read
  actions: read
concurrency:
  group: build-${{ github.ref }}-${{ inputs.platform || 'all' }}
  cancel-in-progress: true
env:
  RUST_VERSION: '1.99.0'
  LLVM_VERSION: '15.0.6'
  VCPKG_COMMIT_ID: '9e593bb18ea69cc5095e012465dcd675a822ed0d'
  VCPKG_CMAKE_VERSION: '4.4.0'
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
jobs:
  targets:
    runs-on: ubuntu-24.04-arm
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      source_sha: ${{ steps.select.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
      - id: select
        env:
          PLATFORM: ${{ inputs.platform || 'all' }}
          SOURCE_REF: ${{ inputs.source_ref }}
          REUSE_RUN_ID: ${{ inputs.reuse_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: python ci/build_matrix.py >> "$GITHUB_OUTPUT"

  browser:
    needs: targets
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.targets.outputs.source_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend --ignore-scripts

      - name: Run the Desk page unit tests
        working-directory: frontend
        run: npm test

      - name: Build browser assets once for all native targets
        run: node ci/browser.mjs desk
      - uses: actions/upload-artifact@v4
        with:
          name: browser
          path: browser/
          if-no-files-found: error
  native:
    env:
      YOODESK_SOURCE_SHA: ${{ needs.targets.outputs.source_sha }}
    permissions:
      contents: write
    needs: [browser, targets]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.targets.outputs.source_sha }}
      - name: Apply the reviewed build-only adapters to the pinned source checkout
        if: inputs.source_ref != ''
        shell: bash
        env:
          BUILD_TOOLS_SHA: ${{ github.sha }}
        run: |
          git fetch --depth 1 origin "$BUILD_TOOLS_SHA"
          git show "$BUILD_TOOLS_SHA:ci/build_adapters.py" > "$RUNNER_TEMP/yoodesk-build-adapters.py"
          python "$RUNNER_TEMP/yoodesk-build-adapters.py" "$YOODESK_SOURCE_SHA" "$BUILD_TOOLS_SHA"
      # Windows 的 build.rs 用这里的 Node 依赖生成可执行文件图标。
      - uses: actions/setup-node@v4
        if: runner.os == 'Windows'
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install the native icon generator
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          npm ci --prefix frontend --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/download-artifact@v4
        with:
          name: browser
          path: browser/

      - uses: actions/cache/restore@v4
        if: runner.os == 'Linux'
        id: linux-tools
        with:
          path: .ci-cache/tools/
          key: ubuntu18-desk-tools-${{ matrix.platform }}-rust199-python3135-openssl354-cmake440-vcpkg9e593-glibc-nasm301-cross-v8-${{ hashFiles('ci/cross-*.sh', 'ci/audit_engine_sysroot.py', 'ci/cross-sysroot-roots.py') }}
          restore-keys: |
            ubuntu18-desk-tools-${{ matrix.platform }}-rust199-python3135-openssl354-cmake440-vcpkg9e593-glibc-nasm301-cross-v8-
            ubuntu18-desk-tools-${{ matrix.platform }}-rust199-python3135-openssl354-cmake440-vcpkg9e593-glibc-nasm301-cross-v7
            ubuntu18-desk-tools-${{ matrix.platform }}-rust199-python3135-openssl354-cmake440-vcpkg9e593-glibc-v3
            ubuntu18-desk-tools-${{ matrix.platform }}-rust199-python3135-openssl354-cmake440-vcpkg9e593-dl-v2
      - uses: actions/cache/restore@v4
        id: native-cache
        with:
          path: |
            .ci-cache/vcpkg/
            target/
            desk-engine/target/
          key: native-desk-${{ matrix.platform }}-rust199-ubuntu18-video144-v3-${{ hashFiles('**/Cargo.lock', 'engine-patches/**', 'scripts/*.py', 'scripts/*.rs', 'ci/linux-build.sh', 'ci/*.py', 'ci/cross-*.sh', 'ci/triplets/**') }}-${{ github.run_id }}
          restore-keys: native-desk-${{ matrix.platform }}-rust199-ubuntu18-video144-v3-
      - uses: actions/setup-python@v5
        if: runner.os == 'Windows'
        with:
          python-version: '3.13'
          architecture: x64
      - uses: dtolnay/rust-toolchain@stable
        if: runner.os == 'Windows'
        with:
          # x64 build scripts can load the exact LLVM 15 used by RustDesk, also on the ARM runner.
          toolchain: '1.99.0-x86_64-pc-windows-msvc'
          targets: ${{ matrix.target }}
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: ${{ matrix.msvc }}
      # macOS 和 Linux 都固定同一个 rustc 版本；runner 预装版本会漂移，
      # 新版本会把 vendored nix 的 macOS 专用代码判为 dead_code。
      - uses: dtolnay/rust-toolchain@stable
        if: runner.os == 'macOS'
        with:
          toolchain: '1.99.0'
          targets: ${{ matrix.target }}
      # Copied from E:/NetJobs/rustdesk/.github/workflows/flutter-build.yml:
      # LLVM 15.0.6, vcpkg 9e593..., static target triplets and MSVC preparation.
      - name: Install LLVM and Clang
        if: runner.os == 'Windows'
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0
        with:
          version: ${{ env.LLVM_VERSION }}
          arch: x64
          directory: ${{ github.workspace }}/artifacts/llvm-x64
      - name: Prepare pinned RustDesk and hwcodec source with YooDesk adapters
        if: runner.os == 'Windows'
        run: python scripts/prepare_sources.py
      - name: Install CMake required by the RustDesk vcpkg scripts
        if: runner.os == 'Windows'
        run: python -m pip install 'cmake==4.4.0'
      - name: Setup vcpkg with GitHub Actions binary cache
        if: runner.os == 'Windows'
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2
        with:
          vcpkgDirectory: C:/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false
      - name: Install vcpkg dependencies from RustDesk's patched manifest
        if: runner.os == 'Windows'
        working-directory: artifacts/rustdesk-engine-src
        shell: pwsh
        run: |
          python "$env:GITHUB_WORKSPACE/scripts/prepare_vcpkg_downloads.py" "$env:VCPKG_ROOT"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $binaryCache="$env:GITHUB_WORKSPACE/.ci-cache/vcpkg"
          New-Item -ItemType Directory -Force -Path $binaryCache | Out-Null
          $env:VCPKG_BINARY_SOURCES="clear;x-gha,readwrite;files,$binaryCache,readwrite"
          & "$env:VCPKG_ROOT/vcpkg.exe" install --triplet '${{ matrix.triplet }}' --host-triplet '${{ matrix.triplet }}' --x-install-root="$env:VCPKG_ROOT/installed"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python "$env:GITHUB_WORKSPACE/scripts/check_video_native.py" "$env:VCPKG_ROOT/installed/${{ matrix.triplet }}/lib/avcodec.lib" '${{ matrix.platform }}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build macOS native code and run tests
        if: matrix.macos
        shell: bash
        env:
          CARGO_BUILD_TARGET: ${{ matrix.target }}
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
          MACOSX_DEPLOYMENT_TARGET: '11.0'
        run: |
          export GITHUB_SHA="$YOODESK_SOURCE_SHA"
          rustup target add '${{ matrix.target }}'
          # vcpkg 的 aom/libvpx 端口需要 nasm；macOS runner 默认没有。
          brew install nasm
          nasm -v
          # Connector 与 WebService 的宿主包由各自的流水线构建；本仓库只产出 Desk 插件。
          python3 scripts/prepare_sources.py
          export VCPKG_ROOT="$PWD/.ci-cache/vcpkg"
          git -C "$VCPKG_ROOT" rev-parse --verify HEAD >/dev/null 2>&1 || {
            mkdir -p "$VCPKG_ROOT" && git clone --depth 1 https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          }
          git -C "$VCPKG_ROOT" fetch --depth 1 https://github.com/microsoft/vcpkg.git '${{ env.VCPKG_COMMIT_ID }}'
          git -C "$VCPKG_ROOT" checkout --detach FETCH_HEAD
          [ -x "$VCPKG_ROOT/vcpkg" ] || "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          python3 scripts/prepare_vcpkg_downloads.py "$VCPKG_ROOT"
          export VCPKG_INSTALLED_ROOT="$VCPKG_ROOT/installed"
          export VCPKGRS_TRIPLET='${{ matrix.triplet }}'
          python3 scripts/prepare_macos_native.py artifacts/rustdesk-engine-src
          "$VCPKG_ROOT/vcpkg" install --triplet '${{ matrix.triplet }}' --host-triplet '${{ matrix.triplet }}' \
            --x-manifest-root=artifacts/rustdesk-engine-src --x-install-root="$VCPKG_INSTALLED_ROOT"
          python3 scripts/build_engine.py
          python3 scripts/check_video_native.py "$VCPKG_INSTALLED_ROOT/${{ matrix.triplet }}/lib/libavcodec.a" '${{ matrix.platform }}'
          cargo test --manifest-path desk-engine/Cargo.toml --locked --release --lib video_ -- --test-threads=1
          export YOODESK_DESK_ENGINE_LIB_DIR="$PWD/desk-engine/target/${{ matrix.target }}/release"
          cargo build --locked --release --lib --target '${{ matrix.target }}'
          # 两个架构都在原生 runner 上，测试与打包都能执行。
          cargo test --locked --lib --target '${{ matrix.target }}'
          python3 ci/package.py desk --platform '${{ matrix.platform }}'
          python3 -m unittest discover -s ci -p 'test_*.py'
      - name: Build Windows native code and run tests
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CARGO_BUILD_TARGET: ${{ matrix.target }}
          RUSTFLAGS: '-C target-feature=+crt-static'
          _CL_: '/MT'
          LIBCLANG_PATH: ${{ github.workspace }}/artifacts/llvm-x64/bin
        run: |
          $env:GITHUB_SHA=$env:YOODESK_SOURCE_SHA
          $env:VCPKG_INSTALLED_ROOT="$env:VCPKG_ROOT/installed"
          $env:VCPKG_DEFAULT_TRIPLET='${{ matrix.triplet }}'
          $env:VCPKG_DEFAULT_HOST_TRIPLET='${{ matrix.triplet }}'
          if ($env:CARGO_BUILD_TARGET -in @('i686-pc-windows-msvc', 'aarch64-pc-windows-msvc')) {
            $env:SODIUM_LIB_DIR="$env:VCPKG_ROOT/installed/${{ matrix.triplet }}/lib"
          }
          python scripts/build_engine.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path desk-engine/Cargo.toml --locked --release --lib video_ -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/test_windows_bitmap.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:YOODESK_DESK_ENGINE_LIB_DIR="$env:GITHUB_WORKSPACE/desk-engine/target/$env:CARGO_BUILD_TARGET/release"
          cargo build --locked --release --lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:CARGO_BUILD_TARGET -eq 'aarch64-pc-windows-msvc') {
            # Use an explicit target and a fresh dependency directory for ARM64 tests.
            cargo test --locked --lib --target "$env:CARGO_BUILD_TARGET" --target-dir "$env:GITHUB_WORKSPACE/artifacts/arm64-tests" --verbose
          } else {
            cargo test --locked --lib
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ci/package.py desk --platform '${{ matrix.platform }}'
      - name: Build every Linux native dependency and binary on Ubuntu 18.04
        if: runner.os == 'Linux' && !matrix.cross
        shell: bash
        run: |
          export GITHUB_SHA="$YOODESK_SOURCE_SHA"
          # Same disposable runner cleanup as the RustDesk Linux workflow.
          sudo rm -rf /opt/ghc /usr/local/lib/android /usr/share/dotnet
          mkdir -p .ci-cache/tools .ci-cache/vcpkg
          docker run --rm \
            -e GITHUB_SHA -e RELEASE_VERSION \
            -v "$PWD:/workspace" -v "$PWD/.ci-cache/tools:/opt/yoodesk-tools" \
            ubuntu:18.04 bash /workspace/ci/linux-build.sh desk '${{ matrix.platform }}' '${{ matrix.target }}' '${{ matrix.triplet }}'
      - name: Cross-compile loong64/mips64el desk plugin with the RustDesk engine and verify under QEMU
        if: matrix.cross && !matrix.oldworld
        timeout-minutes: 360
        shell: bash
        env:
          YOODESK_SYSROOT_AUDIT_ONLY: ${{ inputs.audit_only && '1' || '0' }}
        run: |
          export GITHUB_SHA="$YOODESK_SOURCE_SHA"
          # Same disposable runner cleanup as the RustDesk Linux workflow.
          sudo rm -rf /opt/ghc /usr/local/lib/android /usr/share/dotnet
          mkdir -p .ci-cache/tools
          docker run --rm \
            -e GITHUB_SHA -e RELEASE_VERSION -e YOODESK_SYSROOT_AUDIT_ONLY -e RUST_VERSION='${{ env.RUST_VERSION }}' \
            -v "$PWD:/workspace" -v "$PWD/.ci-cache/tools:/opt/yoodesk-tools" \
            ubuntu:18.04 bash /workspace/ci/cross-engine-build.sh '${{ matrix.platform }}' '${{ matrix.target }}'
      - uses: actions/cache/restore@v4
        if: matrix.oldworld
        id: oldworld-inputs
        with:
          path: |
            .ci-cache/oldworld-toolchain.tar.xz
            .ci-cache/oldworld-sysroot-inputs.tar
            .ci-cache/oldworld-upstream-cargo.tar.xz
            .ci-cache/oldworld-debs/
            .ci-cache/cargo-oldworld/
          key: oldworld-inputs-v2-${{ hashFiles('ci/oldworld-tools.lock.json', 'ci/oldworld-sysroot.lock.json', 'ci/oldworld-sysroot-download.lock.json') }}
          restore-keys: oldworld-inputs-v1-
      - name: Build and inspect the LoongArch old-world ABI 1.0 Desk plugin
        if: matrix.oldworld
        shell: bash
        env:
          YOODESK_SYSROOT_AUDIT_ONLY: ${{ inputs.audit_only && '1' || '0' }}
        run: |
          export GITHUB_SHA="$YOODESK_SOURCE_SHA"
          bash ci/oldworld-build.sh desk
      - uses: actions/cache/save@v4
        if: always() && matrix.oldworld && steps.oldworld-inputs.outputs.cache-hit != 'true'
        with:
          path: |
            .ci-cache/oldworld-toolchain.tar.xz
            .ci-cache/oldworld-sysroot-inputs.tar
            .ci-cache/oldworld-upstream-cargo.tar.xz
            .ci-cache/oldworld-debs/
            .ci-cache/cargo-oldworld/
          key: ${{ steps.oldworld-inputs.outputs.cache-primary-key }}
      - name: Upload the complete cross sysroot audit report
        if: always() && matrix.cross && (inputs.audit_only || matrix.oldworld)
        uses: actions/upload-artifact@v4
        with:
          name: sysroot-audit-${{ matrix.platform }}
          path: artifacts/sysroot-audit-${{ matrix.platform }}.json
          if-no-files-found: warn
      - name: Upload old-world engine diagnostics
        if: always() && matrix.oldworld
        uses: actions/upload-artifact@v4
        with:
          name: oldworld-engine-diagnostics
          path: artifacts/oldworld-engine-*
          if-no-files-found: warn
      - name: Publish immutable third-party native library SDK
        if: always() && matrix.cross && hashFiles('artifacts/native-sdk/*.tar.xz') != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: native-sdk-v1-${{ matrix.platform }}
          name: Native library SDK v1 ${{ matrix.platform }}
          target_commitish: ${{ github.sha }}
          make_latest: false
          overwrite_files: false
          fail_on_unmatched_files: true
          files: artifacts/native-sdk/*
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          path: dist/
          if-no-files-found: error
      - name: Return container build cache ownership to the runner
        if: always() && runner.os == 'Linux'
        shell: bash
        run: |
          for cache in .ci-cache/tools .ci-cache/vcpkg target desk-engine/target; do
            if [[ -e "$cache" ]]; then
              sudo chown -R "$(id -u):$(id -g)" "$cache"
            fi
          done
      - name: Detect reusable native build data
        if: always()
        id: native-data
        shell: bash
        run: |
          if [[ -d target || -d desk-engine/target ]] || [[ -n "$(ls -A .ci-cache/vcpkg 2>/dev/null)" ]]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Preserve native compilation and binary caches after a failed build
        if: always() && steps.native-data.outputs.present == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .ci-cache/vcpkg/
            target/
            desk-engine/target/
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Preserve successfully installed build tools even if native compilation fails
        if: always() && runner.os == 'Linux' && steps.linux-tools.outputs.cache-hit != 'true' && hashFiles('.ci-cache/tools/.ready') != ''
        uses: actions/cache/save@v4
        with:
          path: .ci-cache/tools/
          key: ${{ steps.linux-tools.outputs.cache-primary-key }}
  release:
    if: github.event_name != 'pull_request' && !inputs.audit_only && !inputs.build_only && (github.event_name != 'workflow_dispatch' || inputs.platform == 'all')
    needs: [native, targets]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        if: inputs.release_id != ''
      - uses: actions/download-artifact@v4
        if: inputs.reuse_run_id != ''
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.reuse_run_id }}
          pattern: native-*
          path: dist/
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: dist/
          merge-multiple: true
      - name: Require every platform archive before publishing
        run: |
          for platform in windows-x86 windows-x64 windows-arm64 linux-x64 linux-arm64 linux-loong64 linux-loong64-oldworld linux-mips64el macos-arm64 macos-x64; do
            test -s "dist/yoodesk-desk-$platform.zip"
            (cd dist && sha256sum -c "yoodesk-desk-$platform.zip.sha256")
          done
      - name: Verify every archive identifies the exact pinned source
        env:
          SOURCE_SHA: ${{ needs.targets.outputs.source_sha }}
        run: |
          python3 - <<'PY'
          import glob, hashlib, json, os, zipfile
          archives = glob.glob('dist/*.zip')
          assert len(archives) == 10
          for archive in archives:
              with zipfile.ZipFile(archive) as bundle:
                  metadata = json.loads(bundle.read('plugin.json'))
                  assert archive == 'dist/yoodesk-desk-'+metadata['platform']+'.zip', archive
                  assert metadata['id'] == 'desk' and metadata['abi_version'] == 1, archive
                  assert metadata['source_commit'] == os.environ['SOURCE_SHA'], archive
                  assert hashlib.sha256(bundle.read(metadata['library'])).hexdigest() == metadata['sha256'], archive
          PY
      - name: Upload verified historical-source archives to the prepared release
        if: inputs.release_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.targets.outputs.source_sha }}
          RELEASE_ID: ${{ inputs.release_id }}
        run: python3 ci/publish_verified_plugins.py
      - uses: softprops/action-gh-release@v2
        if: inputs.release_id == ''
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v0.1.0-ci.{0}', github.run_number) }}
          name: 'desk ${{ needs.targets.outputs.source_sha }}'
          target_commitish: ${{ needs.targets.outputs.source_sha }}
          body: |
            Runtime source: `${{ needs.targets.outputs.source_sha }}`
            Build configuration: `${{ github.sha }}`
          make_latest: true
          fail_on_unmatched_files: true
          files: dist/*
