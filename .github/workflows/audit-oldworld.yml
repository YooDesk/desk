name: Audit LoongArch old-world toolchain
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  toolchain:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        id: tools
        with:
          path: .ci-cache/oldworld/
          key: oldworld-rust199-glibc228-qemufe2ec9-v3
          restore-keys: oldworld-rust199-glibc228-61698744-v2
      - name: Compile and execute ABI 1.0 C and Rust programs
        shell: bash
        run: |
          source ci/oldworld-toolchain.sh
          "$YOODESK_OLDWORLD_COMPILER" --version
          "$YOODESK_OLDWORLD_RUSTC" -vV
          mkdir -p artifacts/oldworld
          # The old loader's statx probes must see target files, including libc.
          # QEMU's -L prefix does not redirect every filesystem operation.
          sudo mkdir -p "$YOODESK_OLDWORLD_ROOT/tmp/yoodesk-audit"
          sudo cp "$YOODESK_OLDWORLD_QEMU" "$YOODESK_OLDWORLD_ROOT/tmp/yoodesk-audit/qemu"
          sudo cp Cargo.toml "$YOODESK_OLDWORLD_ROOT/tmp/yoodesk-audit/Cargo.toml"
          run_guest() {
            local binary="$1"
            sudo cp "$binary" "$YOODESK_OLDWORLD_ROOT/tmp/yoodesk-audit/program"
            sudo env QEMU_LD_PREFIX=/ chroot "$YOODESK_OLDWORLD_ROOT" \
              /tmp/yoodesk-audit/qemu -strace /tmp/yoodesk-audit/program \
              2> "${binary}.strace"
          }
          printf '#include <stdio.h>\nint main(void) { puts("old-world C runtime OK"); return 0; }\n' > artifacts/oldworld/probe.c
          "$YOODESK_OLDWORLD_COMPILER" artifacts/oldworld/probe.c -o artifacts/oldworld/probe-c
          run_guest artifacts/oldworld/probe-c
          cat > artifacts/oldworld/probe.rs <<'RS'
          use std::{fs, net::TcpListener, thread};
          fn main() {
              let listener = TcpListener::bind("127.0.0.1:0").unwrap();
              assert_ne!(listener.local_addr().unwrap().port(), 0);
              assert!(fs::metadata("/tmp/yoodesk-audit/Cargo.toml").unwrap().is_file());
              assert_eq!(thread::spawn(|| 42).join().unwrap(), 42);
              println!("old-world Rust runtime OK");
          }
          RS
          "$YOODESK_OLDWORLD_RUSTC" artifacts/oldworld/probe.rs --target loongarch64-unknown-linux-gnu \
            -C linker="$YOODESK_OLDWORLD_COMPILER" -o artifacts/oldworld/probe-rust
          run_guest artifacts/oldworld/probe-rust
          for binary in artifacts/oldworld/probe-c artifacts/oldworld/probe-rust; do
            readelf -h -l -V "$binary"
            python3 - "$binary" <<'PY'
          import re, struct, subprocess, sys
          from pathlib import Path
          path = Path(sys.argv[1])
          data = path.read_bytes()
          assert data[:6] == b'\x7fELF\x02\x01'
          assert struct.unpack_from('<H', data, 18)[0] == 258
          assert struct.unpack_from('<I', data, 48)[0] == 3
          headers = subprocess.check_output(['readelf', '-l', str(path)], text=True)
          assert '/lib64/ld.so.1' in headers
          versions = subprocess.check_output(['readelf', '-V', str(path)], text=True)
          assert all(tuple(map(int, v.split('.'))) <= (2, 28) for v in re.findall(r'GLIBC_(\d+\.\d+)', versions))
          PY
          done
          # Compare the crates.io libc layouts used by our workspace with the
          # actual old-world C headers before compiling product dependencies.
          export RUSTC="$YOODESK_OLDWORLD_RUSTC"
          export CARGO_TARGET_LOONGARCH64_UNKNOWN_LINUX_GNU_LINKER="$YOODESK_OLDWORLD_COMPILER"
          mkdir -p artifacts/oldworld/libc-probe/src
          cat > artifacts/oldworld/libc-layout.c <<'C'
          #include <stddef.h>
          #include <stdio.h>
          #include <signal.h>
          #include <sys/stat.h>
          int main(void) {
              printf("%zu %zu %zu %zu %zu\n", sizeof(struct stat),
                     offsetof(struct stat, st_size), sizeof(struct sigaction),
                     offsetof(struct sigaction, sa_flags), sizeof(sigset_t));
              return 0;
          }
          C
          cat > artifacts/oldworld/libc-probe/Cargo.toml <<'TOML'
          [package]
          name = "oldworld-libc-layout"
          version = "0.1.0"
          edition = "2021"
          [workspace]
          [dependencies]
          libc = "=0.2.191"
          TOML
          cat > artifacts/oldworld/libc-probe/src/main.rs <<'RS'
          use std::mem::{size_of, offset_of};
          fn main() {
              println!("{} {} {} {} {}", size_of::<libc::stat>(),
                       offset_of!(libc::stat, st_size), size_of::<libc::sigaction>(),
                       offset_of!(libc::sigaction, sa_flags), size_of::<libc::sigset_t>());
          }
          RS
          "$YOODESK_OLDWORLD_COMPILER" artifacts/oldworld/libc-layout.c -o artifacts/oldworld/libc-layout-c
          "$oldworld_tools/rust/bin/cargo" build --manifest-path artifacts/oldworld/libc-probe/Cargo.toml \
            --target loongarch64-unknown-linux-gnu
          run_guest artifacts/oldworld/libc-layout-c > artifacts/oldworld/layout-c.txt
          run_guest artifacts/oldworld/libc-probe/target/loongarch64-unknown-linux-gnu/debug/oldworld-libc-layout \
            > artifacts/oldworld/layout-rust.txt
          diff -u artifacts/oldworld/layout-c.txt artifacts/oldworld/layout-rust.txt
      - name: Package the verified reusable old-world toolchain
        shell: bash
        run: |
          mkdir -p artifacts/oldworld-toolchain
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path('.ci-cache/oldworld')
          record = {
              'schema_version': 1,
              'platform': 'linux-loong64-oldworld',
              'abi': '1.0', 'elf_flags': 3, 'glibc': '2.28',
              'interpreter': '/lib64/ld.so.1',
              'rust': json.loads(Path('ci/oldworld-rust.lock.json').read_text()),
              'c_toolchain_sha256': '61698744d55f79f771e357cacf65ffed067d59ea86de5b609c11d8f4243ab90a',
              'qemu_source': 'https://github.com/loongson/qemu/commit/fe2ec9f4b69e6f6272ff72d68b07964bcd232ffd',
              'source_commit': os.environ['GITHUB_SHA'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'validation': ['C execution', 'Rust TCP socket', 'Rust filesystem metadata', 'Rust thread', 'ELF ABI and glibc audit'],
          }
          payload = json.dumps(record, indent=2) + '\n'
          (root / 'oldworld-toolchain.json').write_text(payload)
          Path('artifacts/oldworld-toolchain/yoodesk-toolchain-linux-loong64-oldworld-v1.json').write_text(payload)
          PY
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -I 'xz -T0' \
            -cf artifacts/oldworld-toolchain/yoodesk-toolchain-linux-loong64-oldworld-v1.tar.xz \
            -C .ci-cache/oldworld toolchain rust qemu-oldworld oldworld-toolchain.json
          (cd artifacts/oldworld-toolchain && sha256sum *.tar.xz > yoodesk-toolchain-linux-loong64-oldworld-v1.tar.xz.sha256)
      - name: Publish immutable toolchain for downstream repositories
        uses: softprops/action-gh-release@v2
        with:
          tag_name: oldworld-toolchain-v1
          name: LoongArch old-world ABI 1.0 toolchain v1
          target_commitish: ${{ github.sha }}
          make_latest: false
          overwrite_files: false
          fail_on_unmatched_files: true
          files: artifacts/oldworld-toolchain/*
      - uses: actions/cache/save@v4
        if: always() && steps.tools.outputs.cache-hit != 'true' && hashFiles('.ci-cache/oldworld/rust/bin/rustc') != ''
        with:
          path: .ci-cache/oldworld/
          key: oldworld-rust199-glibc228-qemufe2ec9-v3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oldworld-toolchain-probes
          path: artifacts/oldworld/
